name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pyyaml pytest fastapi httpx pyjwt
      - name: 문법 검사
        run: python -m compileall -q domains services rrsi eval tests system1 tools
      - name: 테스트
        run: python -m pytest tests -q
      - name: 로컬 검증 (다섯 시나리오)
        run: python tests/local_verify.py
      - name: 골든셋 감사
        run: python eval/audit_goldenset.py
