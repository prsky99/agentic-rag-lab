exporters:
  loadbalancing:
    routing_key: traceID
    protocol:
      otlp:
        tls: {insecure: true}
    resolver:
      static:
        hostnames:
          - otel-gateway-0.otel-gateway.rag.svc:4317
          - otel-gateway-1.otel-gateway.rag.svc:4317
