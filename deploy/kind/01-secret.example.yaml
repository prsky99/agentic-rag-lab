# 실제 커밋 금지. SOPS/External Secrets로 주입합니다.
#   kubectl -n rag create secret generic rag-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=INTERNAL_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=GENERATOR_API_KEY=sk-replace-me
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  JWT_SECRET: "replace-with-long-random"
  INTERNAL_TOKEN: "replace-with-long-random"
  GENERATOR_API_KEY: "sk-replace-me"
