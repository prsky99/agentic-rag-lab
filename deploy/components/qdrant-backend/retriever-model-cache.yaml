# retriever Deployment에 더하는 조각입니다(Qdrant 백엔드 전용).
#
# 모델 캐시: fastembed는 FASTEMBED_CACHE_PATH가 없으면 임시 폴더(/tmp/fastembed_cache)에 모델을
#   내려받습니다. 컨테이너 루트 파일 시스템이 읽기 전용이므로 쓰기 가능한 볼륨을 따로 붙이고
#   그 경로를 지정합니다. HF_HOME은 내려받기 라이브러리(huggingface_hub)가 부가 파일을 두는
#   자리로, 같은 볼륨 안으로 옮겨 읽기 전용 홈 디렉터리에 쓰지 않게 합니다.
#   emptyDir은 파드마다 따로 생기고 파드가 사라지면 함께 지워집니다. 그래서 retriever 파드는
#   새로 뜰 때마다 모델을 다시 내려받습니다. 내려받기를 없애려면 모델을 이미지에 넣고
#   EMBED_LOCAL_FILES_ONLY=1을 주거나, emptyDir 대신 PVC를 붙입니다.
#
# startupProbe: /ready는 모델을 다 읽은 뒤에야 200을 돌려줍니다(그 전에는 응답이 늦거나 503).
#   10초 간격 × 30회 = 최대 5분을 기다리고, 그 안에 통과하지 못하면 컨테이너를 다시 시작합니다.
#   startupProbe가 통과하기 전에는 readinessProbe·livenessProbe가 돌지 않습니다.
apiVersion: apps/v1
kind: Deployment
metadata: {name: retriever}
spec:
  template:
    spec:
      containers:
        - name: retriever
          env:
            - {name: FASTEMBED_CACHE_PATH, value: /models/fastembed}
            - {name: HF_HOME, value: /models/hf}
          startupProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts: [{name: model-cache, mountPath: /models}]
      volumes: [{name: model-cache, emptyDir: {sizeLimit: 1Gi}}]
