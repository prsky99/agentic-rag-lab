# Qdrant 백엔드(RETRIEVER_BACKEND=qdrant)에서만 필요한 설정 묶음입니다(kustomize Component).
# 기본(메모리 검색) 경로의 오버레이(deploy/overlays/kind, gke)는 이 묶음을 쓰지 않습니다.
# deploy/overlays/kind-qdrant, gke-qdrant가 이 묶음을 더하고, Makefile은 rag-config.env의
# RETRIEVER_BACKEND가 qdrant일 때 그 오버레이를 적용합니다(make use-qdrant, make deploy, make config).
#
# 왜 필요한가: Qdrant 백엔드의 retriever는 임베딩 모델(기본 약 0.22GB)을 읽어야 검색할 수 있습니다
# (services/retriever/embedding.py). 모델이 이미지에 없으므로 파드가 뜰 때마다 내려받습니다.
#  1) retriever-model-cache.yaml  내려받은 모델을 둘 쓰기 가능한 볼륨과 FASTEMBED_CACHE_PATH,
#                                 /ready가 모델 적재를 기다리는 동안 파드를 죽이지 않을 startupProbe
#  2) retriever-model-egress.yaml 모델 내려받기에 필요한 외부 HTTPS(443) 통신
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - retriever-model-egress.yaml
patches:
  - path: retriever-model-cache.yaml
