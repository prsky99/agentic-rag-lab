apiVersion: v1
kind: Service
metadata: {name: retriever}
spec:
  selector: {app: retriever}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: retriever}
spec:
  replicas: 2
  selector: {matchLabels: {app: retriever}}
  template:
    metadata: {labels: {app: retriever}}
    spec:
      containers:
        - name: retriever
          image: rag/retriever:0.9.0
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: rag-config}}]
          resources:
            requests: {cpu: 300m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
