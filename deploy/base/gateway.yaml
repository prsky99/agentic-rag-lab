apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: rag/gateway:0.9.0
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: rag-config}}]
          env:
            - name: JWKS_URL
              value: ""
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: rag-secrets, key: JWT_SECRET, optional: true}}
            - name: INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: rag-secrets, key: INTERNAL_TOKEN, optional: true}}
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8080"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
