apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      batch:
        timeout: 5s
        send_batch_size: 1024
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 200
        policies:
          - name: errors
            type: status_code
            status_code: {status_codes: [ERROR]}
          - name: slow
            type: latency
            latency: {threshold_ms: 3000}
          - name: baseline
            type: probabilistic
            probabilistic: {sampling_percentage: 5}
    exporters:
      debug: {verbosity: basic}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [debug]
        metrics:                 # services/common/otel.py가 보내는 요청 수·지연 지표
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/conf/config.yaml"]
          ports: [{containerPort: 4317}, {containerPort: 4318}]
          volumeMounts: [{name: conf, mountPath: /conf}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: conf
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector}
spec:
  selector: {app: otel-collector}
  ports: [{name: grpc, port: 4317}, {name: http, port: 4318}]
