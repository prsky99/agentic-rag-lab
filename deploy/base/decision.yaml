apiVersion: v1
kind: Service
metadata: {name: decision}
spec:
  selector: {app: decision}
  ports: [{name: http, port: 8000, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: decision}
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: decision}}
  template:
    metadata: {labels: {app: decision}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: decision
          image: rag/decision:0.9.0
          ports: [{containerPort: 8080, name: http}]
          envFrom:
            - configMapRef: {name: rag-config}
            - secretRef: {name: rag-secrets, optional: true}
          env:
            - name: DECISION_UPSTREAM
              value: ""                 # 비우면 프록시가 로컬 대체 판정을 씁니다
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /v1/version, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 6
