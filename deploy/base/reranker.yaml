apiVersion: v1
kind: Service
metadata: {name: reranker}
spec: {selector: {app: reranker}, ports: [{name: http, port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reranker}
spec:
  replicas: 2
  selector: {matchLabels: {app: reranker}}
  template:
    metadata: {labels: {app: reranker}}
    spec:
      containers:
        - name: reranker
          image: rag/reranker:0.9.0
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: rag-config}}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
