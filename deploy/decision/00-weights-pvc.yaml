# 가중치는 이미지 밖, PVC에 한 번 받아 두고 모든 레플리카가 읽기 전용으로 마운트합니다.
# 다운로드 Job이 쓰고 decision 파드 여러 개(KEDA 1~3개, 노드가 다를 수 있음)가 함께 읽으므로
# ReadWriteMany가 필요합니다.
#
# 스토리지 클래스: standard-rwx(Filestore Basic HDD). GKE의 Filestore CSI에서 Basic HDD는
# 100GiB부터 만들 수 있어 120Gi 요청이 그대로 성립합니다. 이전 값 premium-rwx(Basic SSD)는
# 최소 2.5TiB라 120Gi 요청과 맞지 않았습니다(실제로는 2.5TiB가 만들어지고 그만큼 과금).
#   - standard-rwx 120GiB: Basic HDD 단가 기준 월 수십 달러 수준
#   - premium-rwx  2.5TiB: Basic SSD 단가 기준 월 수백 달러 수준(약 20배 이상)
#   - 모델 적재 속도가 중요하면 zonal-rwx(Zonal, 1TiB부터, 성능 설정 가능)를 검토합니다.
#   단가는 지역마다 다르므로 https://cloud.google.com/filestore/pricing 에서 확인해 주세요.
# Basic HDD는 읽기 대역폭이 작아 vLLM의 첫 적재가 몇 분 더 걸릴 수 있습니다
# (10-decision.yaml의 startupProbe는 최대 10분을 기다립니다).
# 결정 서버를 1개로만 운영한다면 RWO 디스크(standard-rwo·premium-rwo, 120Gi)로 바꾸고
# 20-keda.yaml의 maxReplicaCount를 1로 두는 편이 가장 저렴합니다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: openjev-weights, namespace: rag}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: standard-rwx       # GKE Filestore CSI, Basic HDD(GKE 최소 100GiB)
  resources: {requests: {storage: 120Gi}}
