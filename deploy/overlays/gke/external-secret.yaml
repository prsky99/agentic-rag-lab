apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: rag-secrets, namespace: rag}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-sm, kind: SecretStore}
  target: {name: rag-secrets}
  data:
    - secretKey: GENERATOR_API_KEY
      remoteRef: {key: rag-generator-key}
    - secretKey: JWT_SECRET
      remoteRef: {key: rag-jwt-secret}
    - secretKey: INTERNAL_TOKEN
      remoteRef: {key: rag-internal-token}
