# SecretStore 인증 예제 — GKE Secret Manager + Workload Identity (11.3절).
# external-secret.yaml의 secretStoreRef(gcp-sm)가 가리키는 저장소입니다. 예제이므로
# kustomization.yaml에는 넣지 않았습니다. 복사해 값을 바꾼 뒤 secret-store.yaml로 적용합니다.
# 근거: https://external-secrets.io/latest/provider/google-secrets-manager/ (2026-11-25 확인)
#
# 0) 전제: External Secrets Operator 설치(네임스페이스 external-secrets), 클러스터에
#    Workload Identity 사용(--workload-pool=PROJECT.svc.id.goog), Secret Manager API 사용 설정.
#      gcloud services enable secretmanager.googleapis.com --project PROJECT
#
# 1) 비밀을 읽을 GCP 서비스 계정을 만들고 Secret Manager 읽기 권한을 줍니다.
#    (프로젝트 전체가 아니라 비밀 3개에만 권한을 줍니다.)
#      gcloud iam service-accounts create rag-secrets-reader --project PROJECT
#      for s in rag-generator-key rag-jwt-secret rag-internal-token; do
#        gcloud secrets add-iam-policy-binding "$s" --project PROJECT \
#          --role roles/secretmanager.secretAccessor \
#          --member "serviceAccount:rag-secrets-reader@PROJECT.iam.gserviceaccount.com"
#      done
#
# 2) 아래 쿠버네티스 서비스 계정(rag/external-secrets-sa)이 그 GCP 서비스 계정으로
#    행동할 수 있게 연결합니다(Workload Identity 바인딩).
#      gcloud iam service-accounts add-iam-policy-binding \
#        rag-secrets-reader@PROJECT.iam.gserviceaccount.com --project PROJECT \
#        --role roles/iam.workloadIdentityUser \
#        --member "serviceAccount:PROJECT.svc.id.goog[rag/external-secrets-sa]"
#
# 3) 적용과 확인
#      kubectl apply -f deploy/overlays/gke/secret-store.yaml
#      kubectl -n rag get secretstore gcp-sm         # STATUS=Valid, READY=True
#      kubectl apply -f deploy/overlays/gke/external-secret.yaml
#      kubectl -n rag get externalsecret rag-secrets # STATUS=SecretSynced
#
# 참고
# - 토큰 교환은 연산자 파드(external-secrets 네임스페이스)가 합니다. rag 네임스페이스의
#   기본 거부 네트워크 정책은 연산자 파드에 적용되지 않으므로 정책을 더 열 필요가 없습니다.
# - rag-runner(애플리케이션용)와 계정을 나눈 이유: 애플리케이션 파드는 비밀을 직접 읽을
#   필요가 없으므로, 비밀 읽기 권한을 연산자 전용 계정에만 둡니다.
# - clusterLocation·clusterName·clusterProjectID는 GKE 안에서는 메타데이터 서버에서 자동으로
#   찾으므로 생략할 수 있습니다. 여기서는 어느 클러스터 기준인지 드러나도록 적었습니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: rag
  annotations:
    iam.gke.io/gcp-service-account: rag-secrets-reader@PROJECT.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: gcp-sm, namespace: rag}
spec:
  provider:
    gcpsm:
      projectID: PROJECT                     # 비밀이 들어 있는 프로젝트
      auth:
        workloadIdentity:
          clusterProjectID: PROJECT          # 클러스터가 있는 프로젝트
          clusterLocation: asia-northeast3   # 지역 클러스터는 리전, 영역 클러스터는 존
          clusterName: rag-prod
          serviceAccountRef: {name: external-secrets-sa}
