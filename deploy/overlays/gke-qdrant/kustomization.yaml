# GKE 오버레이 + Qdrant 백엔드 묶음(모델 캐시 볼륨, startupProbe, 모델 내려받기 egress).
# deploy/base/rag-config.env의 RETRIEVER_BACKEND가 qdrant일 때
# `make deploy OVERLAY=deploy/overlays/gke`가 이 오버레이를 적용합니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../gke]
components: [../../components/qdrant-backend]
